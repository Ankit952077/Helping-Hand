<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile | Helping Hands</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/profile.css">

<style>

.profile-page{
padding:60px 8%;
background:#f5f7fb;
min-height:100vh;
}

.profile-card{
background:#fff;
border-radius:20px;
padding:30px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
display:flex;
gap:30px;
align-items:center;
margin-bottom:30px;
}

.profile-card img{
width:180px;
height:180px;
border-radius:50%;
object-fit:cover;
}

.profile-info h2{
color:#0F766E;
margin-bottom:10px;
}

.profile-info p{
margin:8px 0;
}

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-top:30px;
}

.stat{
background:#fff;
padding:25px;
text-align:center;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.stat h1{
color:#0F766E;
font-size:35px;
}

.edit-form{
margin-top:40px;
background:#fff;
padding:30px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.edit-form input,
.edit-form textarea{
width:100%;
padding:14px;
margin:12px 0;
border:1px solid #ddd;
border-radius:10px;
}

.edit-form button{
padding:15px 30px;
background:#0F766E;
color:#fff;
border:none;
border-radius:10px;
cursor:pointer;
}

</style>

</head>

<body>

<header>

<nav class="navbar">

<div class="logo">

❤️ Helping Hands

</div>

<ul class="nav-links">

<li><a href="dashboard.html">Dashboard</a></li>

<li><a href="profile.html">Profile</a></li>

<li><a href="logout.html">Logout</a></li>

</ul>

</nav>

</header>

<section class="profile-page">

<div class="profile-card">

<img src="https://i.pravatar.cc/300?img=12">

<div class="profile-info">

<h2 id="userName">Ankit Kumar</h2>

<p id="userEmail">ankit@example.com</p>

<p id="userPhone">+91 XXXXX XXXXX</p>

<p id="userCity">Aligarh</p>

<p>⭐ Community Hero</p>

</div>

</div>

<div class="stats">

<div class="stat">

<h1>12</h1>

<p>Help Requests</p>

</div>

<div class="stat">

<h1>25</h1>

<p>Donations</p>

</div>

<div class="stat">

<h1>7</h1>

<p>Volunteer Tasks</p>

</div>

<div class="stat">

<h1>94%</h1>

<p>Profile Score</p>

</div>

</div>

<div class="edit-form">

<h2>Edit Profile</h2>

<input id="name" placeholder="Full Name">

<input id="email" placeholder="Email">

<input id="phone" placeholder="Phone">

<input id="city" placeholder="City">

<textarea id="bio" rows="5" placeholder="Write about yourself"></textarea>

<button id="saveBtn">

Save Profile

</button>

</div>

</section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script>

const data = JSON.parse(localStorage.getItem("currentUser")) || {};

document.getElementById("name").value = data.name || "";
document.getElementById("email").value = data.email || "";
document.getElementById("phone").value = data.phone || "";
document.getElementById("city").value = data.city || "";
document.getElementById("bio").value = data.bio || "";

document.getElementById("userName").innerText = data.name || "User";
document.getElementById("userEmail").innerText = data.email || "";
document.getElementById("userPhone").innerText = data.phone || "";
document.getElementById("userCity").innerText = data.city || "";

document.getElementById("saveBtn").onclick = function(){

    let user = JSON.parse(localStorage.getItem("currentUser")) || {};

    user.name  = document.getElementById("name").value;
    user.email = document.getElementById("email").value;
    user.phone = document.getElementById("phone").value;
    user.city  = document.getElementById("city").value;
    user.bio   = document.getElementById("bio").value;

    localStorage.setItem("currentUser", JSON.stringify(user));

    alert("Profile Updated");

    location.reload();
}

</script>

</body>

</html>

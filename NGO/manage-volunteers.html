.volunteer-stats{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-bottom:30px;

}


.v-card{

background:#fff;

padding:25px;

border-radius:20px;

box-shadow:0 10px 25px rgba(0,0,0,.08);

}


.v-card i{

font-size:35px;

color:#0F766E;

margin-bottom:15px;

}


.v-card h2{

font-size:32px;

}



.profile-img{

width:60px;

height:60px;

border-radius:50%;

object-fit:cover;

}



.action{

padding:8px 14px;

border:none;

border-radius:8px;

color:#fff;

cursor:pointer;

}


.view{

background:#2563EB;

}


.approve{

background:#16A34A;

}


.remove{

background:#DC2626;

}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Helping Hands | Register</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#0F766E,#2563EB);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:30px;

}

.container{

width:100%;

max-width:900px;

background:#fff;

border-radius:20px;

padding:40px;

box-shadow:0 20px 40px rgba(0,0,0,.2);

animation:fade .8s;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.logo{

text-align:center;

font-size:35px;

font-weight:bold;

color:#0F766E;

margin-bottom:10px;

}

.subtitle{

text-align:center;

color:#555;

margin-bottom:35px;

}

.form-grid{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:20px;

}

.input-box{

display:flex;

flex-direction:column;

}

.input-box label{

margin-bottom:8px;

font-weight:600;

}

.input-box input,

.input-box select,

textarea{

padding:14px;

border:1px solid #ddd;

border-radius:10px;

font-size:15px;

outline:none;

transition:.3s;

}

.input-box input:focus,

textarea:focus,

select:focus{

border-color:#0F766E;

}

textarea{

grid-column:span 2;

resize:none;

height:120px;

}

.password{

position:relative;

}

.password i{

position:absolute;

right:15px;

top:47px;

cursor:pointer;

color:#777;

}

.checkbox{

margin:20px 0;

}

.checkbox label{

font-size:15px;

}

button{

width:100%;

padding:15px;

border:none;

background:#0F766E;

color:#fff;

font-size:17px;

border-radius:10px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#2563EB;

}

.google{

margin-top:15px;

background:#fff;

color:#333;

border:2px solid #ddd;

}

.google:hover{

background:#f5f5f5;

}

.login{

margin-top:20px;

text-align:center;

}

.login a{

text-decoration:none;

font-weight:bold;

color:#2563EB;

}

.progress{

height:8px;

background:#eee;

border-radius:20px;

margin-top:8px;

overflow:hidden;

}

.progress div{

height:100%;

width:0;

background:#16a34a;

transition:.3s;

}

@media(max-width:768px){

.form-grid{

grid-template-columns:1fr;

}

textarea{

grid-column:span 1;

}

.container{

padding:25px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

❤️ Helping Hands

</div>

<p class="subtitle">

Create your free account

</p>

<form id="registerForm">

<div class="form-grid">

<div class="input-box">

<label>Full Name *</label>

<input
type="text"
id="name"
required>

</div>

<div class="input-box">

<label>Mobile Number *</label>

<input
type="tel"
id="phone"
maxlength="10"
required>

</div>

<div class="input-box">

<label>Email *</label>

<input
type="email"
id="email"
required>

</div>

<div class="input-box">

<label>Gender</label>

<select id="gender">

<option>Male</option>

<option>Female</option>

<option>Other</option>

</select>

</div>

<div class="input-box">

<label>Register As *</label>

<select id="role" required>

<option value="user">User (Need Help)</option>

<option value="volunteer">Volunteer (Provide Help)</option>

</select>

</div>

<div class="input-box">

<label>City</label>

<input
type="text"
id="city">

</div>

<div class="input-box">

<label>State</label>

<input
type="text"
id="state">

</div>

<div class="input-box password">

<label>Password *</label>

<input
type="password"
id="password"
required>

<i class="fa-solid fa-eye" id="eye1"></i>

<div class="progress">

<div id="strength"></div>

</div>

</div>

<div class="input-box password">

<label>Confirm Password *</label>

<input
type="password"
id="confirm"
required>

<i class="fa-solid fa-eye" id="eye2"></i>

</div>

<textarea
id="about"
placeholder="Tell us about yourself..."></textarea>

</div>

<div class="checkbox">

<label>

<input type="checkbox" required>

I agree to the Terms & Privacy Policy

</label>

</div>

<button>

Create Account

</button>

<button
type="button"
class="google">

<i class="fa-brands fa-google"></i>

Continue with Google

</button>

</form>

<div class="login">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</div>

<script>

// ==========================
// Show Password
// ==========================

function toggle(id,eye){

const input=document.getElementById(id);

const icon=document.getElementById(eye);

icon.onclick=function(){

if(input.type==="password"){

input.type="text";

icon.classList.remove("fa-eye");

icon.classList.add("fa-eye-slash");

}else{

input.type="password";

icon.classList.remove("fa-eye-slash");

icon.classList.add("fa-eye");

}

}

}

toggle("password","eye1");

toggle("confirm","eye2");


// ======================
// Show Password
// ==========================

function toggle(id,eye){
    const input = document.getElementById(id);
    const icon = document.getElementById(eye);

    icon.onclick = function(){
        if(input.type === "password"){
            input.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }
}

toggle("password", "eye1");
toggle("confirm", "eye2");

// ==========================
// Password Strength
// ==========================

const password = document.getElementById("password");
const strength = document.getElementById("strength");

password.addEventListener("keyup", () => {
    let value = password.value.length;

    if(value < 5){
        strength.style.width = "30%";
        strength.style.background = "red";
    }
    else if(value < 8){
        strength.style.width = "60%";
        strength.style.background = "orange";
    }
    else{
        strength.style.width = "100%";
        strength.style.background = "green";
    }
});

// ==========================
// Confirm Password Match Check (before submit)
// ==========================

document.getElementById("registerForm").addEventListener("submit", function(e){

    if(document.getElementById("password").value !== document.getElementById("confirm").value){
        e.preventDefault();
        alert("Passwords do not match");
    }

});

</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>

</script>

</body>

</html>

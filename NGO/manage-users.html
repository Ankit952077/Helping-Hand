.action-btn{
padding:8px 14px;
border:none;
border-radius:8px;

color:#fff;
}

.view{
background:#2563EB;
}

.edit{
background:#0F766E;
}

.delete{
background:#DC2626;
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
flex-wrap:wrap;
gap:15px;
}

.top-bar input{
padding:12px 15px;
width:320px;
border:1px solid #ddd;
border-radius:10px;
}

.add-user{
padding:12px 20px;
background:#16A34A;
color:#fff;
border:none;
border-radius:10px;
cursor:pointer;
}

Manage Users

<input
type="text"
id="searchUser"
placeholder="Search User...">

<thead>

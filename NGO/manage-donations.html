<style>

.stats-box{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:20px;

margin-bottom:30px;

}

.donate-card{

background:#fff;

padding:25px;

border-radius:20px;

box-shadow:0 10px 25px rgba(0,0,0,.08);

}

.donate-card i{

font-size:35px;

color:#0F766E;

margin-bottom:15px;

}

.donate-card h2{

font-size:30px;

}

.action{

padding:8px 15px;

border:none;

border-radius:8px;

cursor:pointer;

color:#fff;

}

.view{

background:#2563EB;

}

.verify{

background:#16A34A;

}

.delete{

background:#DC2626;

}

</style>
